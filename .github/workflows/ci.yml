name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  api-unit-tests:
    name: Testes Unitários API (Java/Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Instalar dependências e executar testes da API
        working-directory: api
        run: mvn test

  client-unit-tests:
    name: Testes Unitários Client (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências do client
        working-directory: client
        run: npm ci

      - name: Executar testes Jest
        working-directory: client
        run: npm test -- --watchAll=false --passWithNoTests

  e2e-tests:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [api-unit-tests, client-unit-tests]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_DATABASE: bancoQualidade
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build da API (Maven)
        working-directory: api
        run: mvn package -DskipTests

      - name: Iniciar API em background
        working-directory: api
        run: |
          java -jar target/*.jar \
            --spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bancoQualidade \
            --spring.datasource.username=root \
            --spring.datasource.password=admin &

      - name: Instalar dependências do client
        working-directory: client
        run: npm ci

      - name: Build do client (Next.js)
        working-directory: client
        run: npm run build

      - name: Iniciar client em background
        working-directory: client
        run: npm start &

      - name: Aguardar API estar pronta (porta 8080)
        run: |
          echo "Aguardando API na porta 8080..."
          for i in $(seq 1 30); do
            if nc -z localhost 8080; then
              echo "API pronta!"
              break
            fi
            echo "Tentativa $i/30..."
            sleep 5
          done

      - name: Aguardar Client estar pronto (porta 3000)
        run: |
          echo "Aguardando Client na porta 3000..."
          for i in $(seq 1 30); do
            if nc -z localhost 3000; then
              echo "Client pronto!"
              break
            fi
            echo "Tentativa $i/30..."
            sleep 5
          done

      - name: Instalar dependências do Playwright
        working-directory: tests
        run: npm ci

      - name: Instalar browsers do Playwright
        working-directory: tests
        run: npx playwright install --with-deps

      - name: Executar testes E2E (Playwright)
        working-directory: tests
        run: npx playwright test

      - name: Upload relatório Playwright
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 30
